<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>OpenMag</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
</head>
<body>

    <button id="sidebar-toggle" onclick="toggleSidebar()">☰</button>

    <aside id="source-sidebar" class="sidebar">
        <div class="sidebar-view-toggle">
            <button id="btn-categories" class="active" onclick="showSidebarView('categories')">Kategoriat</button>
            <button id="btn-az" onclick="showSidebarView('az')">A–Ö</button>
            <button id="btn-bookmarks" onclick="showBookmarksView()" title="Show bookmarks">★</button>
        </div>
        <div id="source-list"></div>
    </aside>

    <main>
        <header class="main-header">
            <div class="header-left">
                <h1>OpenMag</h1>
            </div>
            <div class="header-right">
                <!-- Hidden selects preserved for app.js compatibility -->
                <select id="uiLangFilter" style="display:none">
                    <option value="en">English</option>
                </select>
                <select id="scopeFilter" style="display:none">
                    <option value="all">Regions (All)</option>
                    <option value="Finland">Finland</option>
                    <option value="Nordic + Baltic countries">Nordic + Baltic</option>
                    <option value="Europe">Europe</option>
                    <option value="World">World</option>
                </select>
                <button id="settings-btn" class="settings-btn" onclick="toggleSettingsPanel()"><span class="settings-clog">&#9881;</span> <span id="settings-btn-label">SETTINGS</span> <span id="settings-btn-arrow" class="settings-arrow">&#9660;</span></button>
            </div>
            <!-- Settings panel – positioned absolute below the sticky header -->
            <div id="settings-panel" class="settings-panel" hidden>
                <div class="settings-panel-body">
                    <div class="settings-panel-header-row">
                        <button id="settings-close-btn" class="settings-close-btn" onclick="closeSettingsPanel()" aria-label="Close settings">&#10005;</button>
                    </div>
                    <div class="settings-grid">
                        <div class="settings-language-sections">
                            <div class="settings-section">
                                <div class="settings-section-title" id="settings-ui-lang-title">PRIMARY LANGUAGE</div>
                                <select id="settings-ui-lang-select" class="settings-select" aria-label="Primary language">
                                    <!-- Populated by JS -->
                                </select>
                            </div>
                            <div class="settings-section">
                                <div class="settings-section-title" id="settings-content-lang-title">CONTENT LANGUAGES</div>
                                <div class="content-language-list" id="content-language-list" role="group" aria-labelledby="settings-content-lang-title">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                        </div>
                        <div class="settings-section settings-location-section">
                            <div class="settings-section-title" id="settings-locations-title">LOCATIONS</div>
                            <div class="location-tree" id="location-tree">
                                <!-- Populated by JavaScript after loading hierarchy -->
                            </div>
                        </div>
                    </div>
                    <div class="settings-actions">
                        <button id="settings-apply-btn" class="settings-apply-btn" onclick="applySettingsPanel()">APPLY</button>
                        <button id="settings-reset-btn" class="settings-reset-btn" onclick="resetFiltersFromPanel()">RESET</button>
                    </div>
                </div>
            </div>
        </header>

        <div id="feed-header-area">
            <div id="feed-logo-container" style="display:none"></div>
            <div id="feed-info-container">
                <div class="view-title-row">
                    <div id="current-view-title" class="view-title"></div>
                    <button id="title-visibility-toggle" class="visibility-toggle title-visibility-toggle" type="button" hidden><div class="visibility-dot"></div></button>
                </div>
                <div id="current-view-description"></div>
            </div>
        </div>

        <div class="grid" id="magazine-grid">
            <div class="grid-sizer"></div>
        </div>
        
        <div id="scroll-sentinel"></div>
    </main>
    <script src="bookmarks.js"></script>
    <script src="source-preferences.js"></script>
    <script src="language-bundles.js"></script>
    <script src="app.js"></script>
</body>
</html>
